<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <title>Регистрация участника</title>

    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            padding:
                env(safe-area-inset-top)
                env(safe-area-inset-right)
                env(safe-area-inset-bottom)
                env(safe-area-inset-left);

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #1d1d1f;
            background: #f2f3f5;
        }

        .app {
            width: 100%;
            max-width: 580px;
            height: 100%;

            display: flex;
            flex-direction: column;

            overflow: hidden;
            background: #ffffff;
        }

        .header {
            position: relative;
            z-index: 2;
            padding: 20px 20px 16px;
            text-align: center;
            background: #ffffff;
            border-bottom: 1px solid #e7e8ec;
        }

        .header h1 {
            margin: 0 0 6px;
            font-size: 24px;
            line-height: 1.2;
        }

        .header p {
            margin: 0;
            color: #6d7885;
            font-size: 14px;
            line-height: 1.4;
        }

        .form-container {
            flex: 1;
            min-height: 0;
            overflow: hidden;
            background: #ffffff;
        }

        .form-frame {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
            background: #ffffff;
        }

        .success-page {
            position: fixed;
            inset: 0;
            z-index: 1000;

            display: none;
            align-items: center;
            justify-content: center;

            padding:
                calc(24px + env(safe-area-inset-top))
                16px
                calc(24px + env(safe-area-inset-bottom));

            background: #f2f3f5;
        }

        .success-page.visible {
            display: flex;
        }

        .success-card {
            width: 100%;
            max-width: 420px;
            padding: 26px;
            border-radius: 22px;
            background: #ffffff;
            text-align: center;
            box-shadow: 0 6px 30px rgba(0, 0, 0, 0.1);
        }

        .success-icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 16px;
            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #ffffff;
            background: #268244;
            font-size: 30px;
            font-weight: 700;
        }

        .success-card h2 {
            margin: 0 0 10px;
            font-size: 24px;
        }

        .success-description {
            margin: 0 0 20px;
            color: #6d7885;
            font-size: 14px;
            line-height: 1.5;
        }

        #qrcode {
            width: 256px;
            min-height: 256px;
            margin: 0 auto 18px;
            padding: 8px;
            background: #ffffff;
        }

        #qrcode img,
        #qrcode canvas {
            display: block;
            max-width: 100%;
            height: auto;
            margin: auto;
        }

        .participant-label {
            margin-bottom: 6px;
            color: #818c99;
            font-size: 13px;
        }

        .participant-id {
            padding: 10px;
            border-radius: 10px;
            overflow-wrap: anywhere;
            color: #447bba;
            background: #f2f6fa;
            font-size: 13px;
            font-weight: 600;
        }

        @media (min-width: 700px) {
            body {
                padding: 24px;
            }

            .app {
                height: min(820px, 100%);
                border-radius: 22px;
                box-shadow: 0 6px 30px rgba(0, 0, 0, 0.08);
            }
        }
    </style>
</head>

<body>
    <main class="app" id="app">
        <header class="header">
            <h1>Регистрация участника</h1>
            <p>Заполните данные для участия в мероприятии</p>
        </header>

        <div class="form-container">
            <iframe
                id="registration-form"
                class="form-frame"
                title="Регистрация участника"
                frameborder="0"
            ></iframe>
        </div>
    </main>

    <section class="success-page" id="success-page">
        <div class="success-card">
            <div class="success-icon">✓</div>

            <h2>Регистрация завершена</h2>

            <p class="success-description">
                Сохраните QR-код и покажите его при входе на мероприятие.
            </p>

            <div id="qrcode"></div>

            <div class="participant-label">ID участника</div>
            <div class="participant-id" id="participant-id"></div>
        </div>
    </section>

    <script>
        vkBridge.send("VKWebAppInit").catch(() => {});

        const randomBytes = new Uint8Array(8);
        crypto.getRandomValues(randomBytes);

        const randomPart = Array.from(randomBytes)
            .map(byte => byte.toString(16).padStart(2, "0"))
            .join("")
            .toUpperCase();

        const participantId =
            "OUS-" +
            Date.now().toString(36).toUpperCase() +
            "-" +
            randomPart;

        const formUrl = new URL(
            "https://forms.yandex.ru/u/6a907f06e010db47da86dd3e/"
        );

        formUrl.searchParams.set("iframe", "1");
        formUrl.searchParams.set("theme", "light");
        formUrl.searchParams.set("participant_id", participantId);

        const formFrame =
            document.getElementById("registration-form");

        let firstLoadCompleted = false;
        let qrCreated = false;

        formFrame.addEventListener("load", () => {
            if (!firstLoadCompleted) {
                firstLoadCompleted = true;
                return;
            }

            showSuccessPage();
        });

        formFrame.src = formUrl.toString();

        function showSuccessPage() {
            if (!qrCreated) {
                document.getElementById("participant-id").textContent =
                    participantId;

                new QRCode(document.getElementById("qrcode"), {
                    text: participantId,
                    width: 240,
                    height: 240,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });

                qrCreated = true;
            }

            document.getElementById("success-page")
                .classList.add("visible");
        }
    </script>
</body>
</html>
