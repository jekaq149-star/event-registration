<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <title>Регистрация участников</title>

    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #f2f3f5;
        }

        body {
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .form-frame {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
            background: #ffffff;
        }
    </style>
</head>

<body>
    <iframe
        id="registration-form"
        class="form-frame"
        title="Регистрация участников"
        frameborder="0"
    ></iframe>

    <script>
        vkBridge.send("VKWebAppInit")
            .then(() => {
                console.log("VK Mini App инициализирован");
            })
            .catch((error) => {
                console.error("Ошибка инициализации VK:", error);
            });

        const randomBytes = new Uint8Array(8);
        crypto.getRandomValues(randomBytes);

        const randomPart = Array.from(randomBytes)
            .map(byte => byte.toString(16).padStart(2, "0"))
            .join("")
            .toUpperCase();

        const participantId =
            "OUS-" +
            Date.now().toString(36).toUpperCase() +
            "-" +
            randomPart;

        localStorage.setItem("participantId", participantId);

        const formUrl = new URL(
            "https://forms.yandex.ru/u/6a907f06e010db47da86dd3e/"
        );

        formUrl.searchParams.set("iframe", "1");
        formUrl.searchParams.set("theme", "light");
        formUrl.searchParams.set("participant_id", participantId);

        document.getElementById("registration-form").src =
            formUrl.toString();
    </script>
</body>
</html>
