<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <title>Регистрация завершена</title>

    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding:
                calc(24px + env(safe-area-inset-top))
                16px
                calc(24px + env(safe-area-inset-bottom));

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #1d1d1f;
            background: #f2f3f5;
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 24px;
            border-radius: 20px;
            background: #ffffff;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .success-icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 16px;
            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #ffffff;
            background: #268244;
            font-size: 30px;
            font-weight: 700;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 24px;
        }

        .description {
            margin: 0 0 22px;
            color: #6d7885;
            font-size: 15px;
            line-height: 1.5;
        }

        #qrcode {
            width: 256px;
            min-height: 256px;
            margin: 0 auto 18px;
            padding: 8px;
            background: #ffffff;
        }

        #qrcode img,
        #qrcode canvas {
            display: block;
            max-width: 100%;
            height: auto;
            margin: auto;
        }

        .participant-label {
            margin-bottom: 6px;
            color: #818c99;
            font-size: 13px;
        }

        .participant-id {
            padding: 10px;
            border-radius: 10px;
            overflow-wrap: anywhere;
            color: #447bba;
            background: #f2f6fa;
            font-size: 14px;
            font-weight: 600;
        }

        .error {
            color: #e64646;
        }
    </style>
</head>

<body>
    <main class="card">
        <div class="success-icon">✓</div>

        <h1>Регистрация завершена</h1>

        <p class="description">
            Сохраните этот QR-код и покажите его при входе на мероприятие.
        </p>

        <div id="qrcode"></div>

        <div class="participant-label">ID участника</div>
        <div class="participant-id" id="participant-id"></div>
    </main>

    <script>
        vkBridge.send("VKWebAppInit").catch(() => {});

        const participantId =
            localStorage.getItem("participantId");

        const idElement =
            document.getElementById("participant-id");

        if (participantId) {
            idElement.textContent = participantId;

            new QRCode(document.getElementById("qrcode"), {
                text: participantId,
                width: 240,
                height: 240,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        } else {
            idElement.textContent =
                "Не удалось получить ID участника";

            idElement.classList.add("error");
        }
    </script>
</body>
</html>
